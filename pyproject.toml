[project]
name = "OTFFineTune"
version = "0.1.0"
description = "On-the-fly fine-tuning of foundational neural network potentials"
dependencies = [    
    "ase>=3.23.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0",
    "scipy>=1.13.0",
    ]

[project.optional-dependencies]
MACE = [

    "mace-torch==0.3.10",
]

NequIP = [

    "nequip==0.6.1",
    "e3nn==0.5.1",

]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"